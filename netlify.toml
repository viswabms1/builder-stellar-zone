[build]
  command = "npm run build:ssg"
  functions = "netlify/functions"
  publish = "dist/spa"


[functions]
  node_bundler = "esbuild"

# Smart chat endpoint - dedicated function
[[redirects]]
  force = true
  from = "/api/smart-chat"
  status = 200
  to = "/.netlify/functions/smart-chat"

# Other API endpoints
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api"

# SPA fallback: Route all unmatched requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
