<body>
  <div id="root"></div>

  <!-- Chatbot FAB Button - AI Girl Avatar with Floating Animation -->
  <style>
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    #dsu-chat-fab {
      position: fixed;
      bottom: 100px;
      right: 30px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      font-size: 60px;
      z-index: 9999;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      animation: float 3s ease-in-out infinite;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
      pointer-events: none;
    }

    #dsu-chat-fab.ready {
      opacity: 1;
      pointer-events: auto;
    }

    #dsu-chat-fab:hover {
      animation: none;
      transform: translateY(-4px) scale(1.15);
    }

    #dsu-chat-fab:active {
      transform: translateY(-2px) scale(1.08);
    }
  </style>

  <button id="dsu-chat-fab" title="Chat with AI Assistant" aria-label="Open AI Chat">
    🤖
  </button>

  <script>
    (function() {
      var btn = document.getElementById('dsu-chat-fab');
      if (btn) {
        btn.addEventListener('click', function() {
          console.log('Chat button clicked');
          window.dispatchEvent(new CustomEvent('toggle-chatbot'));
        });
      }
    })();
  </script>

  <script type="module" src="/client/main.tsx"></script>
</body>
