<body>
  <div id="root"></div>

  <!-- Chatbot FAB Button - AI Girl Avatar -->
  <div id="dsu-chat-fab-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;font-size:0;">
    <button id="dsu-chat-fab" style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg, #FF69B4 0%, #FFB6C1 50%, #FFC0CB 100%);border:2px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,105,180,0.4);padding:0;margin:0;transition:all 0.2s ease;font-size:32px;" onmouseover="this.style.boxShadow='0 6px 24px rgba(255,105,180,0.6)';this.style.transform='scale(1.1)'" onmouseout="this.style.boxShadow='0 4px 16px rgba(255,105,180,0.4)';this.style.transform='scale(1)'" title="Chat with AI Assistant">
      👩‍💼
    </button>
  </div>

  <script>
    (function() {
      var btn = document.getElementById('dsu-chat-fab');
      if (btn) {
        btn.addEventListener('click', function() {
          console.log('Chat button clicked');
          window.dispatchEvent(new CustomEvent('toggle-chatbot'));
        });
      }
    })();
  </script>

  <script type="module" src="/client/main.tsx"></script>
</body>
