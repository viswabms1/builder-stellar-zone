<body>
  <div id="root"></div>

  <!-- Chatbot FAB Button - AI Girl Avatar - LARGE & VISIBLE -->
  <button id="dsu-chat-fab" style="position:fixed;bottom:40px;right:40px;width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg, #FF1493 0%, #FF69B4 50%, #FFB6C1 100%);border:4px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(255,20,147,0.6);padding:0;margin:0;transition:all 0.3s ease;font-size:50px;z-index:99999!important;" onmouseover="this.style.boxShadow='0 12px 40px rgba(255,20,147,0.8)';this.style.transform='scale(1.15)'" onmouseout="this.style.boxShadow='0 8px 32px rgba(255,20,147,0.6)';this.style.transform='scale(1)'" title="Chat with AI Assistant">
    👩‍💼
  </button>

  <script>
    (function() {
      var btn = document.getElementById('dsu-chat-fab');
      if (btn) {
        btn.addEventListener('click', function() {
          console.log('Chat button clicked');
          window.dispatchEvent(new CustomEvent('toggle-chatbot'));
        });
      }
    })();
  </script>

  <script type="module" src="/client/main.tsx"></script>
